# Default ROS 2 topic subscriptions for the Refringence bridge.
# Override with --topics flag or custom config file.

subscriptions:
  - topic: /joint_states
    msg_type: sensor_msgs/msg/JointState
    rate_hz: 30

  - topic: /tf
    msg_type: tf2_msgs/msg/TFMessage
    rate_hz: 30

  - topic: /clock
    msg_type: rosgraph_msgs/msg/Clock
    rate_hz: 10

