[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "refringence-ros2-bridge"
version = "0.1.0"
description = "Connect ROS 2 simulations to Refringence workspace"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "python-socketio[asyncio]>=5.0",
    "aiohttp>=3.0",
]

[project.optional-dependencies]
ros2 = []  # rclpy and ROS 2 msgs installed via ROS 2 toolchain, not pip

[project.scripts]
refringence-bridge = "refringence_bridge.cli:main"
